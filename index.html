<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe3d6">
<title>Помідорний тир</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#2b1b17;--accent:#e8322c;--card:#fffaf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ffe3d6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hidden{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;display:flex;gap:8px;align-items:center;pointer-events:none}
.pill{pointer-events:auto;background:rgba(255,255,255,.9);border-radius:999px;padding:8px 12px;font-weight:800;font-size:15px;box-shadow:0 2px 8px rgba(120,40,30,.12);white-space:nowrap}
#hMenu{border:none;font-size:18px;padding:6px 12px;font-family:inherit;color:var(--ink)}
#hInfo{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis}
#hSecret{border:none;font-size:18px;padding:6px 10px}
#hSecret.on{box-shadow:0 0 0 3px #f7b8c4}
.power{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 22px);width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.9);padding:0;z-index:3;
  background:conic-gradient(#3d7bff var(--p,0%),rgba(255,255,255,.75) 0);box-shadow:0 4px 14px rgba(43,27,23,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;color:var(--ink);opacity:.85;transition:width .25s,height .25s,opacity .25s;cursor:pointer}
.power .pw-ico{font-size:28px;line-height:1}
.power .pw-lbl{font-size:12px;font-weight:900;margin-top:2px}
.power.ready{width:96px;height:96px;opacity:1;color:#fff;background:radial-gradient(circle at 35% 30%,#7aa6ff,#2a5be0 70%);border-color:#fff;animation:pwr .9s ease-out infinite}
.power.ready .pw-ico{font-size:38px}
.power.ready .pw-lbl{font-size:15px;letter-spacing:1px}
@keyframes pwr{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(61,123,255,.75)}60%{transform:scale(1.1);box-shadow:0 0 0 22px rgba(61,123,255,0)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(61,123,255,0)}}
#task{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 58px);margin:0 auto;max-width:420px;background:rgba(43,27,23,.86);color:#fff;border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px;line-height:1.3;text-align:center;pointer-events:none;z-index:3}
#task.pulse{animation:tp .6s ease 2}
@keyframes tp{50%{transform:scale(1.05);background:#e8322c}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 112px);transform:translate(-50%,-8px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}
#banner{position:fixed;left:16px;right:16px;top:24%;margin:0 auto;max-width:340px;background:linear-gradient(135deg,#fff6c4,#f7c936);border-radius:22px;padding:16px 18px;text-align:center;box-shadow:0 12px 40px rgba(180,120,0,.4);pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);z-index:5}
#banner.show{opacity:1;transform:scale(1)}
#banner .bt{font-weight:900;font-size:18px;margin-bottom:6px}
#banner #bannerText{font-size:17px;font-weight:600}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);background:rgba(43,27,23,.35);z-index:4}
.card{background:var(--card);border-radius:26px;padding:22px 20px 18px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);animation:pop .4s cubic-bezier(.2,1.5,.4,1);max-height:100%;overflow:auto}
@keyframes pop{from{transform:translateY(30px) scale(.9);opacity:0}}
.card h1,.card h2{font-size:25px;margin:4px 0 8px;line-height:1.15}
.card p{font-size:16px;line-height:1.45;margin:0 0 12px;color:#5a3d36}
.hi{font-weight:700;color:#a0523f}
.tag{display:inline-block;background:#ffe3d6;border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;color:#a0523f}
.goal{display:flex;justify-content:center;gap:8px;margin:4px 0 6px;flex-wrap:nowrap}
.goal{gap:6px}
.goal span{background:#fff0e6;border-radius:12px;padding:8px 8px;font-weight:800;font-size:14px;white-space:nowrap}
.stars{font-size:38px;letter-spacing:4px;margin:6px 0}
#rTitle.died{color:#b3121a;font-size:30px;letter-spacing:2px;font-weight:900}
#rTitle.died + .stars{font-size:18px;letter-spacing:0;font-weight:800;color:#8a6a60}
.screen.clear{background:linear-gradient(to bottom,rgba(43,27,23,0) 45%,rgba(43,27,23,.3));align-items:flex-end}
.end-line{font-size:20px!important;font-weight:800;color:var(--ink)!important}
.coupon{position:relative;overflow-x:hidden;background:#fffdf6;border:3px dashed #e8322c;padding:24px 20px 18px}
.coupon:before,.coupon:after{content:'';position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:rgba(43,27,23,.35);transform:translateY(-50%)}
.coupon:before{left:-15px}.coupon:after{right:-15px}
.cp-top{font-size:13px;font-weight:900;letter-spacing:3px;color:#e8322c}
.cp-prize{font-size:22px;font-weight:900;margin:8px 0 6px;line-height:1.2}
.cp-meta{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#8a6a60;border-top:1px dashed #f0ddd5;padding-top:8px;margin-top:10px}
.cp-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.cp-chip{border-radius:14px;border:2px solid #f0ddd5;background:#fff;font-family:inherit;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #e6cfc6;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0;transition:transform .1s}
.cp-chip.on{border-color:#e8322c;background:#fff0ec;box-shadow:0 3px 0 #e8322c;transform:translateY(-2px)}
.cp-chip:disabled{opacity:.4}
.cp-chip.on:disabled{opacity:1}
.cp-opt{height:84px;gap:6px}
.cp-opt .ico{font-size:30px;line-height:1}
.cp-opt .lbl{font-size:13px;line-height:1.1}
.cp-h{font-weight:900;font-size:16px;margin:12px 0 8px}
.cp-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;touch-action:pan-y}
.cp-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cp-nav span{font-weight:800;font-size:14px;color:#5a3d36}
.cp-arrow{width:42px;height:34px;border-radius:12px;border:2px solid #f0ddd5;background:#fff;font-family:inherit;font-size:22px;font-weight:900;line-height:1;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 #e6cfc6;padding:0}
.cp-arrow:disabled{opacity:.3}
.cp-custom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding:6px 6px 6px 12px;border:2px dashed #f0ddd5;border-radius:14px;background:#fff;font-weight:800;font-size:14px;min-height:44px}
.cp-custom.on{border-style:solid;border-color:#e8322c;background:#fff0ec}
.cp-custom input{font-family:inherit;font-size:15px;font-weight:800;color:var(--ink);border:1px solid #f0ddd5;border-radius:10px;background:#fffaf6;padding:6px 8px;min-width:0;max-width:60%;-webkit-user-select:auto;user-select:auto}
.cp-custom input:disabled{opacity:.6}
.cp-day{height:54px;gap:2px}
.cp-day .wd{font-size:11px;font-weight:700;color:#8a6a60}
.cp-day .dn{font-size:17px;font-weight:900;line-height:1}
.cp-times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.cp-time{height:40px;font-size:15px}
#cpGo:disabled{opacity:.5}
.cp-stamp{display:inline-block;border:3px solid #1a9b4b;color:#1a9b4b;font-weight:900;font-size:20px;padding:4px 12px;border-radius:10px;transform:rotate(-8deg);margin:8px 0}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:16px;background:var(--accent);color:#fff;font-size:18px;font-weight:800;text-decoration:none;margin-top:10px;font-family:inherit;box-shadow:0 4px 0 #b11f1a;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b11f1a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #e6cfc6;border:2px solid #f0ddd5}
.row{display:flex;gap:10px}.row .btn{flex:1}
.small{font-size:13px!important;color:#8a6a60!important;margin:10px 0 0!important}
#levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 4px}
.lv{aspect-ratio:1;border:none;border-radius:16px;background:#fff;box-shadow:0 3px 0 #e6cfc6;border:2px solid #f0ddd5;font-family:inherit;font-weight:900;font-size:22px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer}
.lv small{font-size:11px;letter-spacing:1px;font-weight:700;margin-top:2px}
.lv.locked{opacity:.4}
.lv.boss{background:#2b1b17;color:#fff;border-color:#2b1b17}
.card.admin{text-align:left;max-width:440px}
.adm-head{display:flex;align-items:center;justify-content:space-between}
.adm-head h2{margin:0}
#admRefresh{border:none;font-size:18px;font-family:inherit;cursor:pointer}
.pl{background:#fff;border:2px solid #f0ddd5;border-radius:16px;padding:12px;margin:10px 0;cursor:pointer}
.pl-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pl-name{font-weight:900;font-size:16px;overflow-wrap:anywhere;min-width:0}
.pl-name small{display:block;font-size:12px;font-weight:700;color:#8a6a60}
.pl-ago{font-size:12px;color:#8a6a60;white-space:nowrap}
.pl-ago.live{color:#1a9b4b;font-weight:800}
.pl-now{font-size:14px;margin:4px 0 6px;color:#5a3d36}
.pl-lv{display:flex;gap:4px;flex-wrap:wrap}
.pl-lv span{font-size:11px;font-weight:800;background:#fff0e6;border-radius:8px;padding:3px 6px;white-space:nowrap}
.pl-lv span.ok{background:#dff5e6}
.pl-ev{margin-top:8px;border-top:1px dashed #f0ddd5;padding-top:6px;font-size:13px;color:#5a3d36;line-height:1.5}
.pl-ev div{display:flex;gap:8px}.pl-ev b{font-weight:700;color:#8a6a60;min-width:44px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <button class="pill" id="hMenu" aria-label="Меню">☰</button>
  <div class="pill" id="hInfo"></div>
  <button class="pill hidden" id="hSecret" aria-label="Секретна зброя">🧠</button>
  <div class="pill" id="hAmmo"></div>
</div>
<button class="power hidden" id="hPower" aria-label="Суперсила Град"><span class="pw-ico">🌧️</span><span class="pw-lbl" id="hPowerLbl"></span></button>
<div id="task" class="hidden"></div>
<div id="toast"></div>
<div id="banner"><div class="bt">✨ ЗОЛОТИЙ ПОМІДОР ✨</div><div id="bannerText"></div></div>

<div class="screen" id="menu"><div class="card">
  <div class="hi" id="hi"></div>
  <h1>Помідорний тир:<br>сеанс терапії</h1>
  <p>Кидай у мене помідори. Звучить просто — але рівні не для всіх 😏</p>
  <div id="levels"></div>
  <p class="small" id="menuNote"></p>
  <button class="btn ghost hidden" id="adminBtn">👁 Гравці</button>
</div></div>

<div class="screen hidden" id="admin"><div class="card admin">
  <div class="adm-head"><h2>👁 Гравці</h2><button class="pill" id="admRefresh" aria-label="Оновити">↻</button></div>
  <p class="small" id="admStatus"></p>
  <div id="admList"></div>
  <button class="btn ghost" id="admClose">До меню</button>
</div></div>

<div class="screen hidden" id="intro"><div class="card">
  <span class="tag" id="iNum"></span>
  <h2 id="iName"></h2>
  <p id="iDesc"></p>
  <div class="goal" id="iGoal"></div>
  <button class="btn" id="iGo">Почати 🍅</button>
  <button class="btn ghost" id="iBack">До меню</button>
</div></div>

<div class="screen hidden" id="result"><div class="card">
  <h2 id="rTitle"></h2>
  <div class="stars" id="rStars"></div>
  <p id="rText"></p>
  <button class="btn" id="rNext">Далі ➜</button>
  <div class="row"><button class="btn ghost" id="rRetry">Ще раз</button><button class="btn ghost" id="rMenu">Меню</button></div>
</div></div>

<div class="screen clear hidden" id="ending"><div class="card">
  <p class="end-line" id="eLine"></p>
  <div class="row"><button class="btn" id="eYes">Так 😏</button><button class="btn ghost" id="eThink">Подумаю…</button></div>
</div></div>

<div class="screen hidden" id="coupon"><div class="card coupon">
  <div class="cp-top">🎟 КУПОН</div>
  <div class="cp-prize" id="cpPrize"></div>
  <p id="cpText"></p>
  <div class="cp-opts" id="cpOpts"></div>
  <div id="cpWhen" class="hidden">
    <div class="cp-h">Коли? 📅</div>
    <div class="cp-nav"><button class="cp-arrow" id="cpPrev" aria-label="Попередній тиждень">‹</button><span id="cpRange"></span><button class="cp-arrow" id="cpFwd" aria-label="Наступний тиждень">›</button></div>
    <div class="cp-days" id="cpDays"></div>
    <label class="cp-custom" id="cpDateBox"><span>📅 Інша дата</span><input type="date" id="cpDateIn"></label>
    <div class="cp-times" id="cpTimes"></div>
    <label class="cp-custom" id="cpTimeBox"><span>🕐 Свій час</span><input type="time" id="cpTimeIn" step="300"></label>
  </div>
  <div id="cpStamp" class="cp-stamp hidden">АКТИВОВАНО ✅</div>
  <button class="btn" id="cpGo">Активувати</button>
  <button class="btn ghost hidden" id="cpNext">Далі ➜</button>
  <div class="cp-meta"><span id="cpNum"></span><span id="cpDate"></span></div>
</div></div>

<div class="screen hidden" id="final"><div class="card">
  <div class="stars">🍅🍅🍅</div>
  <h2 id="fTitle"></h2>
  <p id="fMsg"></p>
  <p class="small" id="fStats"></p>
  <a class="btn hidden" id="fTg" target="_blank" rel="noopener"></a>
  <button class="btn ghost" id="fMenu">До рівнів</button>
</div></div>

<script>
'use strict';
/* Автооновлення: якщо Telegram показав закешовану стару версію — підтягуємо свіжу */
const BUILD = '2026-11-10-15';
(function checkFresh() {
  try {
    fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => {
      const m = t.match(/const BUILD = '([^']+)'/);
      // перезавантажуємо лише раз: якщо вже відкрито з ?v=<нова>, то не чіпаємо (захист від циклу)
      if (m && m[1] !== BUILD && new URLSearchParams(location.search).get('v') !== m[1]) {
        location.replace(location.pathname + '?v=' + m[1] + location.hash);
      }
    }).catch(() => {});
  } catch (e) {}
})();
/* ============================================================
   НАЛАШТУВАННЯ
   ============================================================ */
const CONFIG = {
  greeting: 'Привіт, Юстино 👋',
  finalTitle: 'Ну що, нарциско, полегшало? 😏',
  // Фінал після боса: 'cutscene' — катсцена «Его розбите» з кнопками; 'coupon' — купон; 'both' — спершу катсцена, потім купон
  ending: 'both',
  // from — з якої дати можна обирати, pickDays — днів на сторінці, weeks — скільки тижнів можна гортати вперед
  coupon: { prize: 'Обери свою нагороду', from: '2026-11-18', pickDays: 7, weeks: 4,
    options: [
      { id: 'coffee', ico: '☕', label: 'Кава',       times: ['10:00', '12:00', '14:00', '16:00', '18:00', '20:00'] },
      { id: 'walk',   ico: '🚶', label: 'Прогулянка', times: ['11:00', '13:00', '15:00', '17:00', '18:00', '19:00'] },
      { id: 'movie',  ico: '🎬', label: 'Кіно',       times: ['14:00', '16:00', '18:00', '19:00', '20:00', '21:00'] },
    ] },
  finalMessage: '',
  telegram: '',                     // юзернейм БЕЗ @ для кнопки у фіналі (порожньо = без кнопки)
  telegramButton: 'Написати йому 💬',
  statsUrl: 'https://pomidor-bot.pomidor-tir.workers.dev',  // Cloudflare Worker для статистики
  adminId: 799375062,               // Telegram id адміна — бачить кнопку «👁 Гравці»
  insideJokes: ['Психологія 🧠'],
  secretWeapon: { emoji: '🧠', name: 'Психологія', color: '#f7b8c4' },
  look: { skin:'#f4d3bf', hair:'#b4582c', hairDark:'#8e3f1d', top:'#27386e', topDark:'#1d2a55', pants:'#26282e', shoes:'#3a3a40', lens:'#3d7bff' },
  goldenChance: 0.05,

  phrases: {
    hit:     ['Ай!', 'Мінус зачіска', 'Кетчуп не пропонувати', '+100 до вітамінів', 'У мене обличчя — салат', 'Критична шкода', 'Мамо, я помідор', 'Кучері не чіпати!', 'Окей, влучно', 'Це взагалі законно?', 'Рудий + червоний = стиль'],
    miss:    ['Мимо 😎', 'Майже!', 'Холодно…', 'Стіні теж дісталося', 'Хе'],
    idle:    ['Чого чекаємо?', 'Помідори самі себе не кинуть', 'Милуєшся мною? Розумію 😏', 'Я тут взагалі-то стою'],
    back:    ['Дзеркало все пам’ятає 🪞', 'Бумеранг повертається', 'Сама в себе? Сміливо', 'Відображення — це твоя сильна сторона 😏'],
    mirror:  ['Не чіпай моє дзеркало!', 'Дзеркальце, скажи…', 'Дзеркало на моєму боці'],
    wrong:   ['Порядок, нарциско, порядок 😏', 'Математика не пробачає', 'Спершу подумай — потім кидай', 'Хто вчив тебе рахувати?'],
    shield:  ['Купол непробивний, поки не розв’яжеш', 'Спершу кульки 🎈', 'Не-а. Логіка спочатку'],
    unshield:['Ой. Купол упав', 'Окей, розумна. Тепер страшно'],
    fake:    ['Закохалася у відображення? 😏', 'Це була копія!', 'Нарцис би пишався', 'Відображення каже дякую'],
    real:    ['Як ти мене вирахувала?!', 'Окей, логіка є', 'Ай! Це був справжній я'],
    phase:   ['Це ще не кінець 😤', 'Его так просто не здається', 'Фаза два? Легко… мабуть'],
    win:     ['Гаразд, цей рівень твій', 'Поважаю', 'Влучність — 10/10', 'Ти страшна людина 😅'],
    lose:    ['Ще раз? Я нікуди не дінуся', 'Помідори закінчились, его — ні 😏', 'Дзеркало перемогло. Поки що'],
    secret:  ['ЦЕ НЕЧЕСНО 😂', 'Психологія, серйозно?!', 'Не аналізуй мене!', 'Це що, сеанс терапії?'],
    dodge:   ['Хе, мимо 😎', 'Не сьогодні', 'Передбачуваний кидок 😏', 'Матриця', 'Читаю тебе як книжку'],
    died:    ['Его перемогло. Поки що 😏', 'Ще одна спроба?', 'Справжні нарциси не здаються', 'Майже! Ну, ні 😅', 'Ти вже читаєш його рухи 👀', 'Рука стає впевненішою 💪'],
  },
};

/* ============================================================
   РІВНІ — кожен трохи складніший за попередній
   ============================================================ */
const LEVELS = [

    ctx.fillStyle = '#fff'; ctx.font = `900 12px ${UIFONT}`; fillCentered(String(q.s), x + 22, yy);
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left'; ctx.fillStyle = '#2b1b17'; ctx.font = `700 14px ${UIFONT}`;
    ctx.fillText(`«${q.text}»`, x + 40, yy + 1);
  });
}
function drawWind() {
  if (!L || !L.windOn) return;
  const w = L.wind, x = 200, y = L.D.boss ? 140 : 92;
  ctx.fillStyle = 'rgba(255,255,255,.88)'; rr(x - 70, y - 16, 140, 32, 16); ctx.fill();
  ctx.font = `800 12px ${UIFONT}`; ctx.fillStyle = '#5a3d36'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('ВІТЕР', x - 60, y);
  const len = (w / 300) * 34;
  ctx.strokeStyle = '#3d7bff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + 22 - len, y); ctx.lineTo(x + 22 + len, y); ctx.stroke();
  if (Math.abs(len) > 3) {
    const d = Math.sign(len), tip = x + 22 + len;
    ctx.beginPath(); ctx.moveTo(tip, y); ctx.lineTo(tip - d * 8, y - 6); ctx.moveTo(tip, y); ctx.lineTo(tip - d * 8, y + 6); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
  for (let k = 0; k < 6; k++) {
    const yy = 140 + k * 80, xx = ((time * w * 0.4 + k * 97) % 460 + 460) % 460 - 30;
    ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx + Math.sign(w || 1) * 24, yy); ctx.stroke();
  }
}
function drawLauncher() {
  const x = LAUNCH.x, y = LAUNCH.y;
  ctx.fillStyle = '#b97a4a'; rr(x - 32, y + 12, 64, 26, 5); ctx.fill();
  ctx.strokeStyle = '#8c5a33'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 32, y + 25); ctx.lineTo(x + 32, y + 25); ctx.stroke();
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y + 14); ctx.lineTo(x, y - 2); ctx.moveTo(x, y - 2); ctx.lineTo(x - 14, y - 18); ctx.moveTo(x, y - 2); ctx.lineTo(x + 14, y - 18); ctx.stroke();
  let bx = x, by = y - 14;
  if (drag) {
    const dx = drag.x - drag.sx, dy = drag.y - drag.sy, len = Math.hypot(dx, dy), k = len > MAXPULL ? MAXPULL / len : 1;
    bx = x + dx * k * 0.45; by = y - 14 + dy * k * 0.45;
  }
  ctx.strokeStyle = '#3a2a20'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 14, y - 18); ctx.lineTo(bx, by); ctx.lineTo(x + 14, y - 18); ctx.stroke();
  if (L && L.ammo > 0 && cooldown <= 0) drawTomato(bx, by, 0, useSecret, false);
  // перезарядка рогатки (на босі)
  if (L && L.D.reload && cooldown > 0 && L.ammo > 0) {
    const k = 1 - cooldown / L.D.reload;
    ctx.strokeStyle = 'rgba(43,27,23,.25)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y - 14, 13, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#e8322c'; ctx.beginPath(); ctx.arc(x, y - 14, 13, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
  }
  if (L && !drag && L.ammo === L.D.ammo && !L.done) {
    const k = (time % 1.6) / 1.6, e = k < 0.7 ? k / 0.7 : 1;
    const hx = x + 10 - e * 40, hy = y - 20 + e * 70;
    ctx.globalAlpha = k < 0.85 ? 1 : (1 - k) / 0.15;
    ctx.strokeStyle = 'rgba(232,50,44,.7)'; ctx.lineWidth = 3; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(x + 10, y - 20); ctx.lineTo(hx, hy); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = `30px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('👆', hx, hy + 14);
    ctx.globalAlpha = 1;
    ctx.font = `800 12px ${UIFONT}`; ctx.fillStyle = '#5a3d36'; ctx.textAlign = 'center';
    ctx.fillText('тягни назад', x - 82, y - 4); ctx.fillText('і відпусти', x - 82, y + 12);
  }
  if (drag && L) {
    const [vx, vy] = pullToVel(drag.x - drag.sx, drag.y - drag.sy);
    let px = x, py = y, pvx = vx, pvy = vy; const dt = 1 / 60, T = L.D.preview;
    ctx.fillStyle = 'rgba(43,27,23,.55)';
    for (let t = 0, k = 0; t < T; t += dt, k++) {
      pvy += G * dt; px += pvx * dt; py += pvy * dt;
      if (k % 4 === 0) circ(px, py, 2.6 * (1 - t / T * 0.6));
    }
    const pw = Math.min(Math.hypot(drag.x - drag.sx, drag.y - drag.sy) / MAXPULL, 1);
    ctx.fillStyle = 'rgba(255,255,255,.85)'; rr(x + 42, y + 2, 54, 12, 6); ctx.fill();
    const crit = L.D.hp && pw >= critAt();
    ctx.fillStyle = crit ? '#f2b630' : pw > 0.95 ? '#e8322c' : '#ff9a3c'; rr(x + 44, y + 4, 50 * pw, 8, 4); ctx.fill();
    if (L.D.hp) {
      const r = rawDamage(pw);
      ctx.font = `800 11px ${UIFONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = crit ? '#b9860f' : 'rgba(90,61,54,.8)';
      ctx.fillText(Math.round(r.dmg * dmgMul()) + (crit ? ' ✦' : ''), x + 100, y + 8);
    }
  }
}
function drawTomato(x, y, rot, secret, golden) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  if (golden) { ctx.fillStyle = 'rgba(255,215,0,.45)'; circ(0, 0, 15); ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 16; }
  ctx.font = `20px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(secret ? CONFIG.secretWeapon.emoji : '🍅', 0, 1);
  ctx.restore();
}
function drawPart(p) {
  ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.fillStyle = p.color;
  if (p.kind === 'drop') circ(p.x, p.y, p.size);
  else if (p.kind === 'star') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 6); ctx.fillRect(-p.size, -p.size * 0.25, p.size * 2, p.size * 0.5); ctx.fillRect(-p.size * 0.25, -p.size, p.size * 0.5, p.size * 2); ctx.restore(); }
  else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
  ctx.globalAlpha = 1;
}
function render() {
  drawBackground();
  if ((state === 'ending' || state === 'coupon' || state === 'final') && E) { drawEnding(); parts.forEach(drawPart); drawBubble(); return; }
  if (L) {
    drawPlatform();
    drawWind();
    drawStatements();
    wallSplats.filter(s => s.y < GROUND - 5).forEach(s => drawSplat(s, s.x, s.y));
    drawTeleportPads();
    if (L.clones) L.clones.forEach(c => drawChar(c));
    else if (L.mode === 'invisible') drawInvisibleBoss();
    else if (L.P && L.P.ghost) drawGhost(L.reveal > 0 ? 1 : 0.41 + Math.sin(L.t * 9) * 0.08);
    else drawChar(ch);
    drawBossBar();
    drawShield();
    drawSegs();
    drawGapHint();
    drawBalloons();
    wallSplats.filter(s => s.y >= GROUND - 5).forEach(s => drawSplat(s, s.x, s.y));
    drawLauncher();
    drawEnemy();
    projs.forEach(p => drawTomato(p.x, p.y, p.rot, p.secret, p.golden));
    drawDmgTexts(1 / 60);
  } else {
    ch.y = 300 - R * 3.25 + 40; ch.x = 200;
    drawChar(ch);
  }
  parts.forEach(drawPart);
  drawBubble();
  if (flash > 0) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = `rgba(220,30,20,${flash})`; ctx.fillRect(0, 0, W, H); }
}

/* ---------- loop ---------- */
function update(dt) {
  decayChar(ch, dt);
  if (L && L.clones) L.clones.forEach(c => decayChar(c, dt));
  for (let i = wallSplats.length - 1; i >= 0; i--) { wallSplats[i].age += dt; if (wallSplats[i].age > 5) wallSplats.splice(i, 1); }
  if (flash > 0) flash = Math.max(0, flash - dt);
  if (state === 'ending' && E) updateEnding(dt);
  if (state === 'play' && L) {
    updateLevel(dt);
    if (L) { bossAI(); hailStep(dt); if (L.enemy) enemyStep(dt); }
    if (L.shieldPop > 0) L.shieldPop -= dt;
    if (cooldown > 0) cooldown -= dt;
    for (let i = projs.length - 1; i >= 0; i--) {
      const p = projs[i]; let res = 'ok';
      for (let k = 0; k < 4 && res === 'ok'; k++) res = stepProj(p, dt / 4);
      if (p.golden && Math.random() < 0.6) parts.push({ x: p.x, y: p.y, vx: rnd(-30, 30), vy: rnd(-30, 30), life: 0.4, max: 0.4, size: rnd(1.5, 3), color: '#ffd700', kind: 'star' });
      if (res === 'gone' || p.age > 8) { const k = projs.indexOf(p); if (k >= 0) projs.splice(k, 1); }
    }
    checkOutOfAmmo();
    if (!L.done && !L.busy && L.t - L.lastAct > 9 && !bubble && !L.clones && L.mode !== 'invisible') { sayPick(CONFIG.phrases.idle); L.lastAct = L.t; }
    // таймер боса
    if (L.timeLeft !== undefined && !L.done && !L.busy) {
      const before = Math.ceil(L.timeLeft); L.timeLeft -= dt;
      if (Math.ceil(L.timeLeft) !== before) { updateHud(); if (L.timeLeft <= 10 && L.timeLeft > 0) tn(880, 880, 0.06, 0.08, 'square'); }
      if (L.timeLeft <= 0) { L.timeLeft = 0; L.done = true; L.win = false; L.reason = 'time'; endTimer = 0.8; SND.err(); }
    }
    if (L.done && endTimer > 0) { endTimer -= dt; if (endTimer <= 0) showResult(); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.kind === 'conf') { p.x += p.vx * dt + Math.sin(time * 3 + p.rot) * 0.4; p.y += p.vy * dt; p.rot += p.vr * dt; }
    else { p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    if (p.life <= 0) parts.splice(i, 1);
  }
  if (bubble) { bubble.t += dt; if (bubble.t > bubble.dur) bubble = null; }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  update(dt); render();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize(); buildMenu();
track('open');
requestAnimationFrame(frame);
</script>
