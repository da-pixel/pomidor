<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe3d6">
<title>Помідорний тир</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#2b1b17;--accent:#e8322c;--card:#fffaf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ffe3d6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hidden{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;display:flex;gap:8px;align-items:center;pointer-events:none}
.pill{pointer-events:auto;background:rgba(255,255,255,.9);border-radius:999px;padding:8px 12px;font-weight:800;font-size:15px;box-shadow:0 2px 8px rgba(120,40,30,.12);white-space:nowrap}
#hMenu{border:none;font-size:18px;padding:6px 12px;font-family:inherit;color:var(--ink)}
#hInfo{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis}
#hSecret{border:none;font-size:18px;padding:6px 10px}
#hSecret.on{box-shadow:0 0 0 3px #f7b8c4}
#task{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 58px);margin:0 auto;max-width:420px;background:rgba(43,27,23,.86);color:#fff;border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px;line-height:1.3;text-align:center;pointer-events:none;z-index:3}
#task.pulse{animation:tp .6s ease 2}
@keyframes tp{50%{transform:scale(1.05);background:#e8322c}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 112px);transform:translate(-50%,-8px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}
#banner{position:fixed;left:16px;right:16px;top:24%;margin:0 auto;max-width:340px;background:linear-gradient(135deg,#fff6c4,#f7c936);border-radius:22px;padding:16px 18px;text-align:center;box-shadow:0 12px 40px rgba(180,120,0,.4);pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);z-index:5}
#banner.show{opacity:1;transform:scale(1)}
#banner .bt{font-weight:900;font-size:18px;margin-bottom:6px}
#banner #bannerText{font-size:17px;font-weight:600}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);background:rgba(43,27,23,.35);z-index:4}
.card{background:var(--card);border-radius:26px;padding:22px 20px 18px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);animation:pop .4s cubic-bezier(.2,1.5,.4,1);max-height:100%;overflow:auto}
@keyframes pop{from{transform:translateY(30px) scale(.9);opacity:0}}
.card h1,.card h2{font-size:25px;margin:4px 0 8px;line-height:1.15}
.card p{font-size:16px;line-height:1.45;margin:0 0 12px;color:#5a3d36}
.hi{font-weight:700;color:#a0523f}
.tag{display:inline-block;background:#ffe3d6;border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;color:#a0523f}
.goal{background:#fff0e6;border-radius:14px;padding:10px;font-weight:700;margin:4px 0 6px}
.stars{font-size:38px;letter-spacing:4px;margin:6px 0}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:16px;background:var(--accent);color:#fff;font-size:18px;font-weight:800;text-decoration:none;margin-top:10px;font-family:inherit;box-shadow:0 4px 0 #b11f1a;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b11f1a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #e6cfc6;border:2px solid #f0ddd5}
.row{display:flex;gap:10px}.row .btn{flex:1}
.small{font-size:13px!important;color:#8a6a60!important;margin:10px 0 0!important}
#levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 4px}
.lv{aspect-ratio:1;border:none;border-radius:16px;background:#fff;box-shadow:0 3px 0 #e6cfc6;border:2px solid #f0ddd5;font-family:inherit;font-weight:900;font-size:22px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer}
.lv small{font-size:11px;letter-spacing:1px;font-weight:700;margin-top:2px}
.lv.locked{opacity:.4}
.lv.boss{background:#2b1b17;color:#fff;border-color:#2b1b17}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <button class="pill" id="hMenu" aria-label="Меню">☰</button>
  <div class="pill" id="hInfo"></div>
  <button class="pill hidden" id="hSecret" aria-label="Секретна зброя">🧠</button>
  <div class="pill" id="hAmmo"></div>
</div>
<div id="task" class="hidden"></div>
<div id="toast"></div>
<div id="banner"><div class="bt">✨ ЗОЛОТИЙ ПОМІДОР ✨</div><div id="bannerText"></div></div>

<div class="screen" id="menu"><div class="card">
  <div class="hi" id="hi"></div>
  <h1>Помідорний тир:<br>сеанс терапії</h1>
  <p>Кидай у мене помідори. Звучить просто — але рівні не для всіх 😏</p>
  <div id="levels"></div>
  <p class="small" id="menuNote"></p>
</div></div>

<div class="screen hidden" id="intro"><div class="card">
  <span class="tag" id="iNum"></span>
  <h2 id="iName"></h2>
  <p id="iDesc"></p>
  <div class="goal" id="iGoal"></div>
  <button class="btn" id="iGo">Почати 🍅</button>
  <button class="btn ghost" id="iBack">До меню</button>
</div></div>

<div class="screen hidden" id="result"><div class="card">
  <h2 id="rTitle"></h2>
  <div class="stars" id="rStars"></div>
  <p id="rText"></p>
  <button class="btn" id="rNext">Далі ➜</button>
  <div class="row"><button class="btn ghost" id="rRetry">Ще раз</button><button class="btn ghost" id="rMenu">Меню</button></div>
</div></div>

<div class="screen hidden" id="final"><div class="card">
  <div class="stars">🍅🍅🍅</div>
  <h2 id="fTitle"></h2>
  <p id="fMsg"></p>
  <p class="small" id="fStats"></p>
  <a class="btn hidden" id="fTg" target="_blank" rel="noopener"></a>
  <button class="btn ghost" id="fMenu">До рівнів</button>
</div></div>

<script>
'use strict';
/* ============================================================
   НАЛАШТУВАННЯ — все особисте змінюється тут
   ============================================================ */
const CONFIG = {
  greeting: 'Привіт, Юстино 👋',
  finalTitle: 'Ну що, нарциско, полегшало? 😏',
  finalMessage: '',                 // додатковий текст під заголовком (можна лишити порожнім)
  telegram: '',                     // твій юзернейм у Telegram БЕЗ @ (кнопка у фіналі). Порожньо = без кнопки
  telegramButton: 'Написати йому 💬',
  insideJokes: ['Психологія 🧠'],   // показуються на золотому помідорі
  secretWeapon: { emoji: '🧠', name: 'Психологія', color: '#f7b8c4' },
  look: { skin:'#f4d3bf', hair:'#b4582c', hairDark:'#8e3f1d', top:'#27386e', topDark:'#1d2a55', pants:'#26282e', shoes:'#3a3a40', lens:'#3d7bff' },
  goldenChance: 0.05,

  phrases: {
    hit:     ['Ай!', 'Мінус зачіска', 'Кетчуп не пропонувати', '+100 до вітамінів', 'У мене обличчя — салат', 'Критична шкода', 'Мамо, я помідор', 'Кучері не чіпати!', 'Окей, влучно', 'Це взагалі законно?', 'Рудий + червоний = стиль'],
    miss:    ['Мимо 😎', 'Майже!', 'Холодно…', 'Стіні теж дісталося', 'Хе'],
    idle:    ['Чого чекаємо?', 'Помідори самі себе не кинуть', 'Милуєшся мною? Розумію 😏', 'Я тут взагалі-то стою'],
    back:    ['Дзеркало все пам’ятає 🪞', 'Бумеранг повертається', 'Сама в себе? Сміливо', 'Відображення — це твоя сильна сторона 😏'],
    mirror:  ['Не чіпай моє дзеркало!', 'Дзеркальце, скажи…', 'Дзеркало на моєму боці'],
    wrong:   ['Порядок, нарциско, порядок 😏', 'Математика не пробачає', 'Спершу подумай — потім кидай', 'Хто вчив тебе рахувати?'],
    shield:  ['Купол непробивний, поки не розв’яжеш', 'Спершу кульки 🎈', 'Не-а. Логіка спочатку'],
    unshield:['Ой. Купол упав', 'Окей, розумна. Тепер страшно'],
    win:     ['Гаразд, цей рівень твій', 'Поважаю', 'Влучність — 10/10', 'Ти страшна людина 😅'],
    lose:    ['Ще раз? Я нікуди не дінуся', 'Помідори закінчились, его — ні 😏', 'Дзеркало перемогло. Поки що'],
    secret:  ['ЦЕ НЕЧЕСНО 😂', 'Психологія, серйозно?!', 'Не аналізуй мене!', 'Це що, сеанс терапії?'],
  },
};

/* ============================================================
   РІВНІ
   ============================================================ */
const LEVELS = [
  { name: 'Розминка', goal: 5, ammo: 12, preview: 0.55,
    desc: 'Тягни палець назад і відпускай — як рогатка. Чим довше тягнеш, тим сильніший кидок.' },
  { name: 'Вітер', goal: 6, ammo: 16, preview: 0.3, wind: true,
    desc: 'Вітер змінюється кожні кілька секунд, а я рухаюсь. Бери упередження — підказка траєкторії тепер коротка.' },
  { name: 'Дзеркальний щит', goal: 6, ammo: 16, preview: 0.3,
    desc: 'У мене дзеркало 🪞 Влучиш у нього — помідор полетить назад у тебе (мінус життя). Лови момент.' },
  { name: 'Рикошет', goal: 3, ammo: 18, preview: 0.3,
    desc: 'Я сховався в печеру. Напряму не дістанеш — тільки через похиле дзеркало праворуч. Кут падіння = куту відбиття. Порахуй, звідки має впасти помідор.' },
  { name: 'Порядок', goal: 3, ammo: 24, preview: 0.3,
    desc: 'Мене захищає купол — від нього помідори відскакують. Внизу 5 кульок з прикладами: збий їх від найменшої відповіді до найбільшої, і купол зникне. Помилився — кульки повертаються, просто спробуй ще.' },
];
const PLANNED = 7; // скільки рівнів буде всього (6 і 7 — скоро)

/* ============================================================ */
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const UIFONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';

// Світ: 400 × 700 логічних одиниць, масштабується під екран
const WW = 400, WH = 700, GROUND = 668;
const G = 900, LAUNCH = { x: 200, y: 636 }, MAXPULL = 130, KPOW = 8.6, PR = 9;
const R = 26;

const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0, time = 0;

/* ---------- Telegram ---------- */
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
if (TG) {
  try { TG.ready(); TG.expand(); } catch (e) {}
  try { TG.disableVerticalSwipes && TG.disableVerticalSwipes(); } catch (e) {}
  try { TG.setHeaderColor && TG.setHeaderColor('#ffe3d6'); TG.setBackgroundColor && TG.setBackgroundColor('#ffe3d6'); } catch (e) {}
}
function buzz(kind) {
  try {
    if (TG && TG.HapticFeedback) {
      if (kind === 'hit') TG.HapticFeedback.impactOccurred('medium');
      else if (kind === 'bad') TG.HapticFeedback.notificationOccurred('error');
      else if (kind === 'win') TG.HapticFeedback.notificationOccurred('success');
      else TG.HapticFeedback.impactOccurred('light');
      return;
    }
    if (navigator.vibrate) navigator.vibrate(kind === 'bad' ? [40, 40, 80] : kind === 'win' ? [30, 50, 30] : kind === 'hit' ? 35 : 12);
  } catch (e) {}
}

/* ---------- storage ---------- */
function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let STARS = load('pt_stars', []);
let totalHits = load('pt_total', 0);
let secretUnlocked = load('pt_secret', false), useSecret = false, goldenSeen = false, goldenIdx = 0;
const UNLOCK_ALL = /[?&]all=1/.test(location.search);

/* ---------- sound ---------- */
let actx = null, noiseBuf = null;
function initAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const len = actx.sampleRate * 0.6;
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function nz(dur, f0, f1, vol, type) {
  if (!actx) return;
  const t = actx.currentTime, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = type || 'lowpass';
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t); s.stop(t + dur);
}
function tn(f0, f1, dur, vol, type, delay) {
  if (!actx) return;
  const t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
const SND = {
  throw:  () => nz(0.16, 700, 2800, 0.05, 'bandpass'),
  splat:  () => { nz(0.28, 1500, 150, 0.6); tn(170, 50, 0.15, 0.25); },
  soft:   () => nz(0.14, 600, 200, 0.18),
  clink:  () => { tn(1800, 1700, 0.18, 0.12, 'triangle'); tn(2600, 2500, 0.12, 0.06, 'sine', 0.02); },
  pop:    () => { nz(0.08, 3000, 800, 0.4, 'bandpass'); tn(600, 1200, 0.08, 0.1, 'triangle'); },
  bad:    () => { tn(300, 120, 0.35, 0.22, 'sawtooth'); },
  golden: () => [660, 880, 1100, 1320].forEach((f, i) => tn(f, f * 1.01, 0.28, 0.16, 'triangle', i * 0.08)),
  win:    () => [523, 659, 784, 1046].forEach((f, i) => tn(f, f * 1.01, 0.25, 0.15, 'triangle', i * 0.1)),
  lose:   () => [392, 330, 262].forEach((f, i) => tn(f, f * 0.98, 0.3, 0.14, 'triangle', i * 0.14)),
  shield: () => { tn(200, 900, 0.5, 0.15, 'sine'); nz(0.4, 4000, 500, 0.2, 'bandpass'); },
};

/* ---------- layout ---------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.min(W / WW, H / WH);
  OX = (W - WW * S) / 2; OY = (H - WH * S) / 2;
}
function toWorld(cx, cy) { return [(cx - OX) / S, (cy - OY) / S]; }

/* ---------- helpers ---------- */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); }
function line(pts, w, col) { ctx.strokeStyle = col || '#2b1b17'; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); }
function blobPts(n) { const a = []; for (let i = 0; i < (n || 11); i++) a.push(rnd(0.62, 1.15)); return a; }
function drawBlob(x, y, s, pts, rot) {
  const n = pts.length;
  const P = i => { const k = ((i % n) + n) % n, a = rot + k / n * TAU, r = pts[k] * s; return [x + Math.cos(a) * r, y + Math.sin(a) * r]; };
  ctx.beginPath();
  let a = P(0), b = P(1);
  ctx.moveTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
  for (let i = 1; i <= n; i++) { const p = P(i), q = P(i + 1); ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
  ctx.closePath(); ctx.fill();
}
function segInt(ax, ay, bx, by, cx, cy, dx, dy) {
  const rx = bx - ax, ry = by - ay, sx = dx - cx, sy = dy - cy, den = rx * sy - ry * sx;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((cx - ax) * sy - (cy - ay) * sx) / den, u = ((cx - ax) * ry - (cy - ay) * rx) / den;
  return (t >= 0 && t <= 1 && u >= 0 && u <= 1) ? t : null;
}

/* ============================================================
   ПЕРСОНАЖ
   ============================================================ */
const CURLS = [];
for (let i = 0; i < 26; i++) CURLS.push({ a: Math.PI * (1.02 + i / 25 * 0.96), d: rnd(0.98, 1.12), s: rnd(0.2, 0.28) });
for (let i = 0; i < 12; i++) CURLS.push({ a: Math.PI * rnd(1.15, 1.85), d: rnd(0.55, 0.85), s: rnd(0.22, 0.3) });

const ch = { x: 200, y: 300, shake: 0, squash: 0, tilt: 0, expr: 'idle', exprT: 0, splats: [] };

function drawArm(side, up) {
  const r = R, L = CONFIG.look;
  ctx.save(); ctx.translate(side * r * 0.98, r * 1.08);
  ctx.rotate(up ? -side * 2.6 : -side * (0.16 + Math.sin(time * 2 + side) * 0.04));
  ctx.fillStyle = L.top; rr(-r * 0.21, -r * 0.05, r * 0.42, r * 1.1, r * 0.2); ctx.fill();
  ctx.fillStyle = L.topDark; rr(-r * 0.22, r * 0.9, r * 0.44, r * 0.16, r * 0.06); ctx.fill();
  ctx.fillStyle = L.skin; circ(0, r * 1.18, r * 0.18);
  ctx.restore();
}
function drawGlasses(x, y, s, hanging) {
  ctx.save(); ctx.translate(x, y);
  if (hanging) ctx.rotate(Math.PI / 2 + 0.05);
  const w = s * 0.62, h = s * 0.42, gap = s * 0.12;
  ctx.fillStyle = CONFIG.look.lens; ctx.globalAlpha = 0.9;
  rr(-gap / 2 - w, -h / 2, w, h, s * 0.08); ctx.fill(); rr(gap / 2, -h / 2, w, h, s * 0.08); ctx.fill();
  ctx.globalAlpha = 1; ctx.strokeStyle = '#d9dde6'; ctx.lineWidth = Math.max(1, s * 0.05);
  rr(-gap / 2 - w, -h / 2, w, h, s * 0.08); ctx.stroke(); rr(gap / 2, -h / 2, w, h, s * 0.08); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-gap / 2, -h * 0.15); ctx.lineTo(gap / 2, -h * 0.15); ctx.stroke();
  ctx.restore();
}
function drawBody(expr) {

    const pw = Math.min(Math.hypot(drag.x - drag.sx, drag.y - drag.sy) / MAXPULL, 1);
    ctx.fillStyle = 'rgba(255,255,255,.85)'; rr(x + 42, y + 2, 54, 12, 6); ctx.fill();
    ctx.fillStyle = pw > 0.95 ? '#e8322c' : '#ff9a3c'; rr(x + 44, y + 4, 50 * pw, 8, 4); ctx.fill();
  }
}
function drawTomato(x, y, rot, secret, golden) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  if (golden) { ctx.fillStyle = 'rgba(255,215,0,.45)'; circ(0, 0, 15); ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 16; }
  ctx.font = `20px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(secret ? CONFIG.secretWeapon.emoji : '🍅', 0, 1);
  ctx.restore();
}
function drawPart(p) {
  ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.fillStyle = p.color;
  if (p.kind === 'drop') circ(p.x, p.y, p.size);
  else if (p.kind === 'star') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 6); ctx.fillRect(-p.size, -p.size * 0.25, p.size * 2, p.size * 0.5); ctx.fillRect(-p.size * 0.25, -p.size, p.size * 0.5, p.size * 2); ctx.restore(); }
  else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
  ctx.globalAlpha = 1;
}
function render() {
  drawBackground();
  if (L) {
    drawPlatform();
    drawWind();
    wallSplats.filter(s => s.y < GROUND - 5).forEach(s => drawSplat(s, s.x, s.y));
    drawChar();
    drawShield();
    drawSegs();
    drawGapHint();
    drawBalloons();
    wallSplats.filter(s => s.y >= GROUND - 5 || s.y > LAUNCH.y - 30).forEach(s => drawSplat(s, s.x, s.y));
    drawLauncher();
    projs.forEach(p => drawTomato(p.x, p.y, p.rot, p.secret, p.golden));
  } else {
    // меню: персонаж просто стоїть
    ch.y = 300 - R * 3.25 + 40; ch.x = 200;
    drawChar();
  }
  parts.forEach(drawPart);
  drawBubble();
  if (flash > 0) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = `rgba(220,30,20,${flash})`; ctx.fillRect(0, 0, W, H); }
}

/* ---------- loop ---------- */
function update(dt) {
  ch.shake = Math.max(0, ch.shake - dt * 4); ch.squash = Math.max(0, ch.squash - dt * 2.5); ch.tilt *= Math.pow(0.02, dt);
  if (ch.exprT > 0) ch.exprT -= dt;
  ch.splats.forEach(s => s.age += dt);
  for (let i = wallSplats.length - 1; i >= 0; i--) { wallSplats[i].age += dt; if (wallSplats[i].age > 5) wallSplats.splice(i, 1); }
  if (flash > 0) flash = Math.max(0, flash - dt);
  if (state === 'play' && L) {
    updateLevel(dt);
    if (cooldown > 0) cooldown -= dt;
    for (let i = projs.length - 1; i >= 0; i--) {
      const p = projs[i]; let res = 'ok';
      for (let k = 0; k < 4 && res === 'ok'; k++) res = stepProj(p, dt / 4);
      if (p.golden && Math.random() < 0.6) parts.push({ x: p.x, y: p.y, vx: rnd(-30, 30), vy: rnd(-30, 30), life: 0.4, max: 0.4, size: rnd(1.5, 3), color: '#ffd700', kind: 'star' });
      if (res === 'gone' || p.age > 8) projs.splice(i, 1);
    }
    checkOutOfAmmo();
    if (!L.done && L.t - L.lastAct > 8 && !bubble) { sayPick(CONFIG.phrases.idle); L.lastAct = L.t; }
    if (L.done && endTimer > 0) { endTimer -= dt; if (endTimer <= 0) showResult(); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.kind === 'conf') { p.x += p.vx * dt + Math.sin(time * 3 + p.rot) * 0.4; p.y += p.vy * dt; p.rot += p.vr * dt; }
    else { p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    if (p.life <= 0) parts.splice(i, 1);
  }
  if (bubble) { bubble.t += dt; if (bubble.t > bubble.dur) bubble = null; }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  update(dt); render();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize(); buildMenu();
requestAnimationFrame(frame);
</script>
</body>
